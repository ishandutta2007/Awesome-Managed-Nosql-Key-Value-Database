<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Main Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Header & Accent Line Gradient -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Gradients for Background Glowing Orbs (100% Valid SVG) -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Embedded CSS Animations -->
    <style>
      @keyframes pulse-orb {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.15); }
      }
      @keyframes dash-animation {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-node {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .orb-1 { animation: pulse-orb 6s ease-in-out infinite; transform-origin: 180px 100px; }
      .orb-2 { animation: pulse-orb 8s ease-in-out infinite 2s; transform-origin: 1020px 220px; }
      .flow-path { stroke-dasharray: 12 12; animation: dash-animation 25s linear infinite; }
      .floating-card-1 { animation: float-node 5s ease-in-out infinite; }
      .floating-card-2 { animation: float-node 5s ease-in-out infinite 1.2s; }
      .floating-card-3 { animation: float-node 5s ease-in-out infinite 2.4s; }
      .floating-card-4 { animation: float-node 5s ease-in-out infinite 3.6s; }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)" stroke="#334155" stroke-width="1.5" />

  <!-- Animated Radial Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="100" r="220" fill="url(#orb-blue)" />
  <circle class="orb-2" cx="1020" cy="220" r="240" fill="url(#orb-purple)" />
  <circle cx="600" cy="160" r="180" fill="url(#orb-indigo)" />

  <!-- Decorative Network Lines & Connection Nodes -->
  <g opacity="0.3">
    <path class="flow-path" d="M 40,240 Q 300,140 600,240 T 1160,140" fill="none" stroke="url(#accent-gradient)" stroke-width="2" />
    <path class="flow-path" d="M 80,70 Q 450,160 800,70 T 1120,90" fill="none" stroke="url(#accent-gradient)" stroke-width="1.5" />
    <circle cx="200" cy="115" r="4" fill="#38bdf8" />
    <circle cx="450" cy="160" r="4" fill="#818cf8" />
    <circle cx="800" cy="70" r="4" fill="#c084fc" />
    <circle cx="1000" cy="190" r="4" fill="#38bdf8" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#accent-gradient)" />

  <!-- MAIN FOREGROUND TEXT & BADGES -->

  <!-- Top Category Pill Badge -->
  <g transform="translate(415, 36)">
    <rect x="0" y="0" width="370" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="185" y="21" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">
      AWESOME MANAGED NOSQL DIRECTORY
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="118" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    Awesome Managed NoSQL Key-Value Database
  </text>

  <!-- Subtitle -->
  <text x="600" y="158" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">
    Curated SaaS Managed Platforms, Serverless Data Stores &amp; High-Performance Open-Source Databases
  </text>

  <!-- Key Feature Cards (Pill Boxes) -->
  <g transform="translate(140, 198)">
    <!-- Card 1 -->
    <g class="floating-card-1" transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="48" rx="10" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1" />
      <text x="105" y="29" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        Cloud &amp; Serverless SaaS
      </text>
    </g>

    <!-- Card 2 -->
    <g class="floating-card-2" transform="translate(235, 0)">
      <rect x="0" y="0" width="210" height="48" rx="10" fill="url(#card-bg)" stroke="#818cf8" stroke-width="1" />
      <text x="105" y="29" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        Key-Value &amp; Wide-Column
      </text>
    </g>

    <!-- Card 3 -->
    <g class="floating-card-3" transform="translate(470, 0)">
      <rect x="0" y="0" width="210" height="48" rx="10" fill="url(#card-bg)" stroke="#c084fc" stroke-width="1" />
      <text x="105" y="29" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        Sub-Millisecond Latency
      </text>
    </g>

    <!-- Card 4 -->
    <g class="floating-card-4" transform="translate(705, 0)">
      <rect x="0" y="0" width="210" height="48" rx="10" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1" />
      <text x="105" y="29" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        Open Source Ecosystem
      </text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="100" y="316" width="1000" height="2" fill="url(#accent-gradient)" opacity="0.6" />
</svg>
